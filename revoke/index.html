<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Collection Manager – Richiesta di rimozione</title>

  <!-- Open Graph / WhatsApp preview -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="🎮 Game Collection Manager – Richiesta di rimozione" />
  <meta property="og:description" content="Un tuo contatto ti chiede di rimuoverlo dalla condivisione della tua collezione." />
  <meta property="og:image"       content="https://alemin91.github.io/gc-invite/invite/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url"         content="https://alemin91.github.io/gc-invite/revoke" />
  <meta name="twitter:card"       content="summary_large_image" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #7c3aed44;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 400px;
    }
    h1 { color: #a78bfa; margin-top: 0; }
    p { color: #94a3b8; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
      font-weight: 600;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 Game Collection Manager</h1>
    <p id="msg">Apertura dell'app in corso…</p>
    <a id="fallback" class="btn" style="display:none" href="#">Apri l'app</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      if (!token) {
        document.getElementById('msg').textContent = 'Link di rimozione non valido.';
        return;
      }
      var deepLink = 'gamecollection://revoke?token=' + encodeURIComponent(token);
      // Try to open the app
      window.location.href = deepLink;
      // After a short delay, show a fallback if app didn't open
      setTimeout(function () {
        document.getElementById('msg').textContent =
          "Se l'app non si è aperta, assicurati di avere Game Collection Manager installato.";
        var btn = document.getElementById('fallback');
        btn.href = deepLink;
        btn.style.display = 'inline-block';
      }, 1500);
    })();
  </script>
</body>
</html>
