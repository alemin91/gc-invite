<!DOCTYPE html>
<html>
<head><title>Convert OG image to PNG</title></head>
<body style="font-family:sans-serif;padding:2rem;background:#0f172a;color:#e2e8f0">
  <h2>Converti og-image.svg → og-image.png</h2>
  <p>Clicca il bottone, poi salva il file come <code>og-image.png</code> in questa stessa cartella.</p>
  <button id="btn" style="padding:.75rem 1.5rem;background:#7c3aed;color:white;border:none;border-radius:.5rem;cursor:pointer;font-size:1rem">
    Scarica og-image.png
  </button>
  <br><br>
  <canvas id="c" style="border:1px solid #334155;max-width:100%"></canvas>
  <script>
    document.getElementById('btn').onclick = function() {
      var img = new Image();
      img.onload = function() {
        var c = document.getElementById('c');
        c.width = 1200; c.height = 630;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, 1200, 630);
        var a = document.createElement('a');
        a.download = 'og-image.png';
        a.href = c.toDataURL('image/png');
        a.click();
      };
      img.src = 'og-image.svg';
    };
  </script>
</body>
</html>
