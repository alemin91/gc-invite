<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow blobs -->
  <ellipse cx="200" cy="150" rx="250" ry="200" fill="#7c3aed" opacity="0.12"/>
  <ellipse cx="1050" cy="500" rx="200" ry="180" fill="#4f46e5" opacity="0.10"/>

  <!-- Card -->
  <rect x="100" y="80" width="1000" height="470" rx="32" fill="url(#card)" stroke="#7c3aed" stroke-width="1.5" opacity="0.9"/>

  <!-- Controller icon background circle -->
  <circle cx="600" cy="195" r="72" fill="url(#purple)" opacity="0.2"/>
  <circle cx="600" cy="195" r="62" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>

  <!-- Game controller SVG icon (centered) -->
  <g transform="translate(560, 155) scale(2.2)" fill="#a78bfa">
    <!-- Controller body -->
    <path d="M17.5 7H2.5C1.12 7 0 8.12 0 9.5v5C0 15.88 1.12 17 2.5 17h15c1.38 0 2.5-1.12 2.5-2.5v-5C20 8.12 18.88 7 17.5 7z" opacity="0.3"/>
    <path d="M17.5 6h-15C1.12 6 0 7.12 0 8.5v5C0 14.88 1.12 16 2.5 16h15c1.38 0 2.5-1.12 2.5-2.5v-5C20 7.12 18.88 6 17.5 6z" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
    <!-- D-pad vertical -->
    <rect x="4" y="8.5" width="1.5" height="4" rx="0.5"/>
    <!-- D-pad horizontal -->
    <rect x="2.75" y="9.75" width="4" height="1.5" rx="0.5"/>
    <!-- Right buttons -->
    <circle cx="14.5" cy="9.5" r="0.9"/>
    <circle cx="16.5" cy="11" r="0.9"/>
    <circle cx="14.5" cy="12.5" r="0.9"/>
    <circle cx="12.5" cy="11" r="0.9"/>
  </g>

  <!-- App title -->
  <text x="600" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="-1">Game Collection Manager</text>

  <!-- Divider -->
  <rect x="480" y="340" width="240" height="2" rx="1" fill="url(#purple)" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="600" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">Vorresti condividere la tua collezione</text>
  <text x="600" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">PlayStation con me?</text>

  <!-- CTA pill -->
  <rect x="430" y="472" width="340" height="52" rx="26" fill="url(#purple)" opacity="0.9"/>
  <text x="600" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="white" text-anchor="middle">Apri nell'app →</text>
</svg>
